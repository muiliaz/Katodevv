name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository. Without this block the token carries
# whatever the repository defaults grant, which is usually more.
permissions:
  contents: read

jobs:
  build:
    # Pinned rather than ubuntu-latest: that label moves to a new image on
    # GitHub's schedule, so a build can start failing without a commit and
    # a past failure cannot be reproduced.
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      # Pinned to commit SHAs, not tags: a tag can be moved to point at
      # different code, and a floating major silently changes what runs here.
      # The trailing comment is the human-readable version — keep it in step
      # with the SHA when bumping. Both resolved from the v4 tags on 2026-08-06.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24 ships npm 11, the version package-lock.json was generated
          # with. On npm 10 `npm ci` rejects the lockfile as out of sync.
          node-version: 24
          # Same major as netlify.toml's NODE_VERSION.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check env contract
        # Cheap and needs no secrets: fails if a function reads a variable
        # .env.example does not declare. Runs before the tests so a broken
        # contract is reported in seconds rather than after the build.
        run: npm run check:env

      - name: Check formatting
        # Held off for three sessions because the first run rewrites almost
        # every file. Done now as its own commit, containing nothing else, so
        # this step failing means someone changed formatting — never that a
        # real change is buried in whitespace.
        run: npm run check:format

      - name: Lint
        # react-scripts used to lint on every build; the Vite migration removed
        # it, so for a while there was none. Restored as its own step, which is
        # what the CI/CD audit asked for in item 5.
        run: npm run lint

      - name: Check for dead code
        # dead-code audit, MEDIUM: "Добавить автоматическую проверку
        # недостижимых модулей и лишних зависимостей" — so the Portfolio
        # cluster cannot quietly accumulate again.
        run: npm run check:dead

      - name: Check for dead CSS
        # knip does not read CSS, and re-running the dead-code audit found 149
        # classes no element could ever carry — a whole hero variant's
        # stylesheet outliving its JSX. Nothing in the toolchain had a reason
        # to notice. Now something does.
        run: npm run check:css

      - name: Test
        # With coverage: the thresholds in vite.config.mjs are a ratchet, so a
        # change that drops coverage below where it stands today fails here.
        run: npm run test:coverage

      - name: Build
        # Netlify builds with the same command, so a red build here means a
        # broken deploy.
        #
        # CI=true used to make react-scripts treat lint warnings as errors.
        # Vite has no such behaviour — a real lint gate would be a separate
        # step, and there is no lint config in the project yet.
        run: npm run build

  # ── End-to-end ──────────────────────────────────────────────────────────────
  #
  # Its own job, not another step in `build`: it downloads a browser binary and
  # renders WebGL in software, so it takes minutes where the rest takes seconds.
  # Keeping it separate means a lint or unit failure is still reported quickly,
  # and the two run in parallel.
  #
  # It needs no secrets. The Netlify function is intercepted in the test and
  # Turnstile is stubbed — see the header of frontend/e2e/enquiry.spec.js.
  e2e:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        # Chromium only — the suite declares one project, and the other two
        # engines would triple the download for nothing. --with-deps pulls the
        # system libraries the runner image does not ship.
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        # playwright.config.js builds the site and serves it with `vite preview`
        # before the first test, so there is no separate build step here.
        run: npm run test:e2e

      - name: Upload the report when it fails
        # The traces and screenshots the config keeps on failure. Without this
        # a red run in CI can only be reproduced by guessing.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
